<div class="container mt-5" style="max-width: 520px;">
  <h2 class="mb-4">Creeaza un cont</h2>

  <div *ngIf="error()" class="alert alert-danger">{{ error() }}</div>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="row">
      <div class="col-6 mb-3">
        <label for="firstName" class="form-label">Prenume</label>
        <input id="firstName" type="text" class="form-control"
               formControlName="firstName"
               [class.is-invalid]="submitted() && f['firstName'].invalid">
        <div *ngIf="submitted() && f['firstName'].invalid" class="invalid-feedback">
          Prenume obligatoriu (min. 2 caractere).
        </div>
      </div>

      <div class="col-6 mb-3">
        <label for="lastName" class="form-label">Nume</label>
        <input id="lastName" type="text" class="form-control"
               formControlName="lastName"
               [class.is-invalid]="submitted() && f['lastName'].invalid">
        <div *ngIf="submitted() && f['lastName'].invalid" class="invalid-feedback">
          Nume obligatoriu (min. 2 caractere).
        </div>
      </div>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email" type="email" class="form-control"
             formControlName="email"
             [class.is-invalid]="submitted() && f['email'].invalid">
      <div *ngIf="submitted() && f['email'].invalid" class="invalid-feedback">
        Email obligatoriu si valid.
      </div>
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Parola</label>
      <input id="password" type="password" class="form-control"
             formControlName="password"
             [class.is-invalid]="submitted() && f['password'].invalid">
      <div *ngIf="submitted() && f['password'].invalid" class="invalid-feedback">
        Parola obligatorie (min. 6 caractere).
      </div>
    </div>

    <div class="mb-3">
      <label for="confirmPassword" class="form-label">Confirma parola</label>
      <input id="confirmPassword" type="password" class="form-control"
             formControlName="confirmPassword"
             [class.is-invalid]="submitted() && registerForm.errors?.['passwordMismatch']">
      <div *ngIf="submitted() && registerForm.errors?.['passwordMismatch']" class="invalid-feedback">
        Parolele nu coincid.
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
      {{ loading() ? 'Se proceseaza...' : 'Inregistreaza-te' }}
    </button>
  </form>

  <p class="mt-3 text-center">
    Ai deja cont? <a routerLink="/login">Login</a>
  </p>
</div>
